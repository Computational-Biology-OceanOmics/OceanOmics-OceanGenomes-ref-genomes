# hichifi_pipeline.conf — single config file for a HiFi+HiC assembly batch run.
#
# Edit RUN_NAME and OG_IDS for your batch, then run:
#   bash hichifi_run.sh hichifi_pipeline.conf
#
# Use {user} as a placeholder for your scratch username (expanded automatically
# at runtime — works for whoever runs the script, not just one person).
# Do NOT put spaces around '='.

# ---- Batch identity ----
# Pick a unique name for this batch, e.g. hichifi_YYYYMMDD_N (N = nth batch that day)
RUN_NAME=hichifi_YYYYMMDD_N

# Samples to assemble this batch (comma-separated OG IDs)
OG_IDS="OG0000,OG0001"

# ---- Database connection ----
POSTGRES_CFG=~/postgresql_details/oceanomics.cfg
SQL_CONFIG=~/postgresql_details/oceanomics.cfg

# ---- BaseSpace connection (used by the pipeline's HiFi/HiC validation steps) ----
BS_CONFIG=~/.basespace/default.cfg

# ---- Where staged HiFi/HiC data + pipeline outputs live ----
# This becomes the Nextflow --outdir. Each OG gets its own subdirectory here.
STAGING_BASE_DIR=/scratch/pawsey0964/{user}/ref-gen

# ---- Where to write the generated samplesheet ----
SAMPLESHEET_OUTPUT_DIR=/scratch/pawsey0964/{user}/ref-gen/OceanOmics-OceanGenomes-ref-genomes/assets
SAMPLESHEET_FILENAME_PREFIX=samplesheet_{run}
SAMPLESHEET_LATEST_NAME=samplesheet_{run}.csv
SAMPLESHEET=/scratch/pawsey0964/{user}/ref-gen/OceanOmics-OceanGenomes-ref-genomes/assets/samplesheet_{run}.csv

# ---- Rclone remotes/buckets ----
HIC_BUCKET=s3:oceanomics/OceanGenomes/illumina-hic
HIFI_BUCKET=s3:oceanomics/OceanGenomes/pacbio-sra

# Optional: extra rclone flags (e.g., --transfers 8 --checkers 16)
RCLONE_FLAGS=""

# Comma-separated Hi-C run IDs already part of THIS batch (excluded from the
# "stage previous HiC runs" step so they aren't double-staged). Leave empty
# if this batch has no fresh Hi-C sequencing run of its own.
CURRENT_HIC_RUN_IDS=""

# ---- Nextflow pipeline knobs ----
ASSEMBLY_MODE=hifi_hic
SCAFFOLDER=yahs
BUSCODB=/scratch/pawsey0964/{user}/busco_db/actinopterygii_odb10
GXDB=/scratch/references/Foreign_Contamination_Screening/gxdb
BINDDIR=/scratch
TEMPDIR=/scratch/pawsey0964/{user}/ref-gen/tmp

# ---- Notifications ----
# Optional: SLURM failure emails for the post-assembly jobs (chromsyn, backup,
# audit, etc). Leave empty to skip — Asana task creation/failure alerts always
# go to whoever's Asana token is configured on the machine that runs this.
NOTIFY_EMAIL=""
